name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '38 3 * * 5'
permissions:
  contents: read
jobs:
  publication_policy:
    name: Evaluate publication policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      normal_uploads: ${{ steps.policy.outputs.normal_uploads }}
      rust_uploads: ${{ steps.policy.outputs.rust_uploads }}
      database_upload: ${{ steps.policy.outputs.database_upload }}
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - name: Require exact lowercase true for publication
        id: policy
        shell: pwsh
        env:
          CODEQL_UPLOAD_REQUEST: ${{ vars.CODEQL_ADVANCED_ACTIVE }}
        run: |
          $ErrorActionPreference='Stop'
          $enabled=[string]::Equals($env:CODEQL_UPLOAD_REQUEST,'true',[StringComparison]::Ordinal)
          $lines=if ($enabled) {
            @('normal_uploads=["always"]','rust_uploads=["failure-only"]','database_upload=true','publish=true')
          } else {
            @('normal_uploads=["never"]','rust_uploads=["never"]','database_upload=false','publish=false')
          }
          if ([string]::IsNullOrEmpty($env:GITHUB_OUTPUT)) { throw 'policy_output_unavailable' }
          [IO.File]::AppendAllLines($env:GITHUB_OUTPUT,[string[]]$lines,[Text.UTF8Encoding]::new($false))
          if ($enabled) { Write-Host 'CodeQL publication mode: active' } else { Write-Host '::notice title=CodeQL publication::validation-only; no Code Scanning upload' }
  interpreted:
    needs: publication_policy
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
        upload: ${{ fromJSON(needs.publication_policy.outputs.normal_uploads) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: codeql_analyze
        with:
          # Matrix values let the official post action resolve failed-run publication.
          upload: ${{ matrix.upload }}
          upload-database: ${{ needs.publication_policy.outputs.database_upload }}
          output: ${{ runner.temp }}/codeql-query-results
          category: /language:${{ matrix.language }}
      - name: Preserve completed query results
        if: ${{ always() && steps.codeql_analyze.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-query-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-query-results/*.sarif
          if-no-files-found: error
          retention-days: 3
  rust:
    needs: publication_policy
    name: Analyze (rust)
    strategy:
      fail-fast: false
      matrix:
        upload: ${{ fromJSON(needs.publication_policy.outputs.rust_uploads) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-18
          components: rust-src
          targets: aarch64-apple-ios-sim
      - name: Describe all tracked Rust inputs
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.rs' > "$RUNNER_TEMP/codeql-rust-files.nul"
          SYSROOT=$(rustc --print sysroot)
          CODEQL_RUST_SYSROOT="$SYSROOT" node <<'RUST_PROJECT'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const root=process.cwd(),spec=JSON.parse(fs.readFileSync('rust-project.json','utf8'));
          const tracked=fs.readFileSync(path.join(process.env.RUNNER_TEMP,'codeql-rust-files.nul'),'utf8').split('\0').filter(Boolean).sort();
          if(!tracked.length||new Set(tracked).size!==tracked.length)throw Error('rust_input_inventory');
          const selected=new Set(tracked),seen=new Set(),queue=spec.crates.map(c=>c.root_module);
          for(const name of queue){
            if(seen.has(name))continue;
            if(!selected.has(name)||path.isAbsolute(name)||name.split('/').some(p=>p==='..'||p==='.'||!p))throw Error('rust_project_outside_inventory');
            const file=path.join(root,name),stat=fs.lstatSync(file);
            if(!stat.isFile()||stat.isSymbolicLink())throw Error('rust_source_kind');
            seen.add(name);
            const source=fs.readFileSync(file,'utf8');
            for(const match of source.matchAll(/include!\s*\(\s*"([^"]+\.rs)"\s*\)/g))queue.push(path.posix.normalize(path.posix.join(path.posix.dirname(name),match[1])));
          }
          if(seen.size!==selected.size||tracked.some(p=>!seen.has(p)))throw Error('rust_project_missing_tracked_source');
          const sysroot=process.env.CODEQL_RUST_SYSROOT;
          if(!sysroot||!path.isAbsolute(sysroot))throw Error('rust_sysroot_unknown');
          spec.sysroot=sysroot;spec.sysroot_src=path.join(sysroot,'lib/rustlib/src/rust/library');
          if(!fs.statSync(spec.sysroot_src).isDirectory())throw Error('rust_src_missing');
          for(const crate of spec.crates){
            crate.root_module=path.join(root,crate.root_module);
            crate.source.include_dirs=crate.source.include_dirs.map(p=>path.join(root,p));
          }
          const inventory=tracked.map(p=>{const data=fs.readFileSync(path.join(root,p));return {path:p,bytes:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex')};});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'codeql-rust-inputs.json'),JSON.stringify(inventory));
          fs.writeFileSync('rust-project.json',JSON.stringify(spec));
          console.log('rust_project_crate_views='+spec.crates.length+' tracked_sources='+tracked.length+' full_build=false');
          RUST_PROJECT
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: codeql_init
        with:
          languages: rust
          build-mode: none
          db-location: ${{ runner.temp }}/codeql_databases
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: codeql_analyze
        with:
          # Normal results stay local; the official post action may publish genuine failed-run diagnostics.
          upload: ${{ matrix.upload }}
          upload-database: false
          output: ${{ runner.temp }}/codeql-query-results
          category: /language:rust
      - name: Verify the analyzed Rust source archive and SARIF
        id: rust_results_verified
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/codeql_databases/rust/src.zip"
          test -s "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > "$RUNNER_TEMP/codeql-rust-archive-members.txt"
          node <<'RUST_COVERAGE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          const archive=path.join(process.env.RUNNER_TEMP,'codeql_databases/rust/src.zip');
          const inputs=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'codeql-rust-inputs.json'),'utf8'));
          const members=fs.readFileSync(path.join(process.env.RUNNER_TEMP,'codeql-rust-archive-members.txt'),'utf8').split(/\r?\n/).filter(Boolean);
          for(const input of inputs){
            if(!Number.isSafeInteger(input.bytes)||input.bytes<0||input.bytes>8*1024*1024||typeof input.path!=='string')throw Error('rust_archive_inventory_invalid');
            const matches=members.filter(p=>p===input.path||p.endsWith('/'+input.path));
            if(matches.length!==1)throw Error('rust_source_archive_missing_or_duplicate');
            const body=cp.execFileSync('unzip',['-p',archive,matches[0]],{maxBuffer:Math.max(input.bytes+1,1),timeout:5000});
            if(body.length!==input.bytes||crypto.createHash('sha256').update(body).digest('hex')!==input.sha256)throw Error('rust_source_archive_byte_mismatch');
          }
          console.log('rust_source_archive_inputs_verified='+inputs.length+' cfg_path_completeness=not_proved');
          const resultDir=path.join(process.env.RUNNER_TEMP,'codeql-query-results');
          const names=fs.readdirSync(resultDir).filter(n=>path.extname(n)==='.sarif').sort();
          if(names.length!==1||names[0]!=='rust.sarif')throw Error('rust_sarif_set');
          const sarifFile=path.join(resultDir,'rust.sarif'),sarifStat=fs.lstatSync(sarifFile);
          if(!sarifStat.isFile()||sarifStat.isSymbolicLink()||sarifStat.size<1||sarifStat.size>64*1024*1024)throw Error('rust_sarif_kind');
          const sarifRaw=fs.readFileSync(sarifFile);
          if(sarifRaw.length!==sarifStat.size)throw Error('rust_sarif_read');
          let sarifValue;try{sarifValue=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(sarifRaw));}catch{throw Error('rust_sarif_parse');}
          if(sarifValue.version!=='2.1.0'||!Array.isArray(sarifValue.runs)||sarifValue.runs.length<1||sarifValue.runs.some(r=>!r||!r.tool||!r.tool.driver||r.tool.driver.name!=='CodeQL'))throw Error('rust_sarif_structure');
          const verifiedDir=path.join(process.env.RUNNER_TEMP,'codeql-verified-rust');
          fs.mkdirSync(verifiedDir,{mode:0o700});
          const stagedSarif=path.join(verifiedDir,'rust.sarif');
          fs.writeFileSync(stagedSarif,sarifRaw,{flag:'wx',mode:0o400});
          const stagedRaw=fs.readFileSync(stagedSarif),sarifDigest=crypto.createHash('sha256').update(sarifRaw).digest('hex');
          if(stagedRaw.length!==sarifRaw.length||crypto.createHash('sha256').update(stagedRaw).digest('hex')!==sarifDigest)throw Error('rust_sarif_stage_mismatch');
          fs.writeFileSync(path.join(verifiedDir,'verified-inputs.json'),JSON.stringify({scope:'CodeQL uploader input snapshot; not a transport payload hash',source_inputs:inputs.length,source_archive:{bytes:fs.statSync(archive).size,sha256:crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')},sarif:{name:'rust.sarif',bytes:sarifRaw.length,sha256:sarifDigest}}),{flag:'wx',mode:0o400});
          console.log('rust_verified_sarif_files=1 source_bytes_verified=true');
          RUST_COVERAGE
      - name: Preserve unverified Rust diagnostics
        if: ${{ failure() && steps.codeql_analyze.outcome == 'success' && steps.rust_results_verified.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-rust-unverified-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-query-results/*.sarif
            ${{ runner.temp }}/codeql-rust-archive-members.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Bundle and verify the analyzed Rust database
        id: rust_database_verified
        if: ${{ success() && needs.publication_policy.outputs.publish == 'true' && steps.rust_results_verified.outcome == 'success' }}
        shell: bash
        timeout-minutes: 4
        env:
          DATABASE_PUBLISH: ${{ needs.publication_policy.outputs.publish }}
          CODEQL_PATH: ${{ steps.codeql_init.outputs.codeql-path }}
          CODEQL_DATABASES: ${{ steps.codeql_analyze.outputs.db-locations }}
        run: |
          set -euo pipefail
          node <<'RUST_DATABASE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),cp=require('node:child_process');
          function fail(code){throw Error(code);}
          function fileInfo(file){
            const fd=fs.openSync(file,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
            try{
              const st=fs.fstatSync(fd);if(!st.isFile()||!Number.isSafeInteger(st.size)||st.size<1)fail('rust_database_file_kind');
              const hash=crypto.createHash('sha256'),buf=Buffer.alloc(65536);let n;
              while((n=fs.readSync(fd,buf,0,buf.length,null))>0)hash.update(buf.subarray(0,n));
              return {bytes:st.size,sha256:hash.digest('hex')};
            }finally{fs.closeSync(fd);}
          }
          if(process.env.DATABASE_PUBLISH!=='true')fail('rust_database_publication_disabled');
          if(process.env.GITHUB_SERVER_URL!=='https://github.com'){console.log('rust_database_upload_not_eligible=server');process.exit(0);}
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')),repo=process.env.GITHUB_REPOSITORY;
          if(!/^[\w.-]+\/[\w.-]+$/.test(repo||'')||event.repository?.full_name!==repo)fail('rust_database_repository_identity');
          const branch=event.repository?.default_branch;
          if(typeof branch!=='string'||!branch)fail('rust_database_default_branch_unknown');
          if(process.env.GITHUB_REF!=='refs/heads/'+branch){console.log('rust_database_upload_not_eligible=non_default_branch');process.exit(0);}
          const commit=process.env.GITHUB_SHA;
          if(!/^[0-9a-f]{40}$/.test(commit||'')||cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8',timeout:5000}).trim()!==commit)fail('rust_database_commit_identity');
          const cluster=path.join(process.env.RUNNER_TEMP,'codeql_databases'),db=path.join(cluster,'rust');
          const locations=JSON.parse(process.env.CODEQL_DATABASES||'null');
          if(!locations||typeof locations.rust!=='string'||path.resolve(locations.rust)!==path.resolve(db))fail('rust_database_location');
          if(fs.realpathSync(db)!==path.resolve(db))fail('rust_database_location_symlink');
          const dir=path.join(process.env.RUNNER_TEMP,'codeql-verified-rust'),proof=JSON.parse(fs.readFileSync(path.join(dir,'verified-inputs.json'),'utf8'));
          const archive=path.join(db,'src.zip'),source=fileInfo(archive);
          if(source.bytes!==proof.source_archive?.bytes||source.sha256!==proof.source_archive?.sha256)fail('rust_database_source_changed');
          const cli=process.env.CODEQL_PATH;if(!cli||!path.isAbsolute(cli))fail('rust_database_cli_missing');
          cp.execFileSync(cli,['database','cleanup',db,'--cache-cleanup=clear'],{stdio:'inherit',timeout:60000});
          const bundle=path.join(dir,'rust-database.zip');if(fs.existsSync(bundle))fail('rust_database_bundle_exists');
          const args=['database','bundle',db,'--output='+bundle,'--name=rust'];
          const baseOids=path.join(cluster,'base-database-oids.json');
          if(fs.existsSync(baseOids)){
            fs.copyFileSync(baseOids,path.join(db,'base-database-oids.json'));
            args.push('--include','base-database-oids.json');
          }
          cp.execFileSync(cli,args,{stdio:'inherit',timeout:60000});
          const members=cp.execFileSync('unzip',['-Z1',bundle],{encoding:'utf8',timeout:10000,maxBuffer:8*1024*1024}).split(/\r?\n/).filter(Boolean);
          if(members.filter(p=>p==='rust/src.zip').length!==1||members.filter(p=>p==='rust/codeql-database.yml').length!==1)fail('rust_database_bundle_members');
          const nested=cp.execFileSync('unzip',['-p',bundle,'rust/src.zip'],{timeout:10000,maxBuffer:source.bytes+1});
          if(nested.length!==source.bytes||crypto.createHash('sha256').update(nested).digest('hex')!==source.sha256)fail('rust_database_bundle_source_mismatch');
          const after=fileInfo(archive);if(after.bytes!==source.bytes||after.sha256!==source.sha256)fail('rust_database_source_changed');
          const info=fileInfo(bundle);fs.chmodSync(bundle,0o400);
          fs.writeFileSync(path.join(dir,'verified-database.json'),JSON.stringify({repository:repo,commit_oid:commit,ref:process.env.GITHUB_REF,language:'rust',bundle:{name:'rust-database.zip',...info},source_archive:source}),{flag:'wx',mode:0o400});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready=true\n');
          console.log('rust_database_bundle_verified=true bytes='+info.bytes+' sha256='+info.sha256);
          RUST_DATABASE
      - name: Preserve verified Rust query inputs
        if: ${{ always() && steps.rust_results_verified.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-query-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-verified-rust/rust.sarif
            ${{ runner.temp }}/codeql-verified-rust/verified-inputs.json
            ${{ runner.temp }}/codeql-verified-rust/verified-database.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload verified Rust SARIF
        id: codeql_rust_publish
        if: ${{ success() && steps.rust_results_verified.outcome == 'success' && needs.publication_policy.outputs.publish == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-verified-rust/rust.sarif
          category: /language:rust
          wait-for-processing: true
      - name: Upload the verified Rust database
        id: codeql_rust_database_publish
        if: ${{ success() && needs.publication_policy.outputs.publish == 'true' && steps.rust_database_verified.outputs.ready == 'true' }}
        shell: bash
        timeout-minutes: 2
        env:
          DATABASE_PUBLISH: ${{ needs.publication_policy.outputs.publish }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'RUST_DATABASE_UPLOAD'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),https=require('node:https');
          async function main(){
            if(process.env.DATABASE_PUBLISH!=='true')throw Error('rust_database_publication_disabled');
            const dir=path.join(process.env.RUNNER_TEMP,'codeql-verified-rust'),meta=JSON.parse(fs.readFileSync(path.join(dir,'verified-database.json'),'utf8'));
            const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            if(process.env.GITHUB_SERVER_URL!=='https://github.com'||meta.repository!==process.env.GITHUB_REPOSITORY||event.repository?.full_name!==meta.repository||meta.ref!==process.env.GITHUB_REF||meta.ref!=='refs/heads/'+event.repository?.default_branch||meta.commit_oid!==process.env.GITHUB_SHA||meta.language!=='rust')throw Error('rust_database_upload_identity');
            const file=path.join(dir,'rust-database.zip'),fd=fs.openSync(file,fs.constants.O_RDONLY|fs.constants.O_NOFOLLOW);
            let stream;
            try{
              const st=fs.fstatSync(fd),hash=crypto.createHash('sha256'),buf=Buffer.alloc(65536);let pos=0,n;
              if(!st.isFile()||st.size!==meta.bundle?.bytes||meta.bundle?.name!=='rust-database.zip')throw Error('rust_database_upload_file');
              while((n=fs.readSync(fd,buf,0,buf.length,pos))>0){hash.update(buf.subarray(0,n));pos+=n;}
              if(hash.digest('hex')!==meta.bundle.sha256)throw Error('rust_database_upload_hash');
              const token=process.env.GITHUB_TOKEN;if(!token)throw Error('rust_database_upload_token_missing');
              const url=new URL('https://uploads.github.com/repos/'+meta.repository+'/code-scanning/codeql/databases/rust');
              url.searchParams.set('name','rust-database');url.searchParams.set('commit_oid',meta.commit_oid);
              stream=fs.createReadStream(file,{fd,autoClose:false,start:0});
              let status;
              await new Promise((resolve,reject)=>{
                let settled=false,timer;
                const finish=error=>{if(settled)return;settled=true;clearTimeout(timer);error?reject(error):resolve();};
                const req=https.request(url,{method:'POST',agent:false,headers:{Authorization:'Bearer '+token,'User-Agent':'CodeQL-database-upload','Content-Type':'application/zip','Content-Length':st.size,'X-GitHub-Api-Version':'2022-11-28'}},res=>{
                  status=res.statusCode;res.resume();res.once('error',finish);res.once('aborted',()=>finish(Error('rust_database_upload_response_aborted')));
                  res.once('end',()=>finish(status>=200&&status<300?undefined:Error('rust_database_upload_http_'+status)));
                });
                timer=setTimeout(()=>req.destroy(Error('rust_database_upload_deadline')),60000);
                req.once('error',finish);req.once('close',()=>{if(!settled)finish(Error('rust_database_upload_closed'));});
                stream.once('error',error=>{req.destroy();finish(error);});stream.pipe(req);
              });
              console.log('rust_database_upload_http_status='+status+' commit_oid='+meta.commit_oid+' bytes='+st.size+' sha256='+meta.bundle.sha256);
            }finally{if(stream)stream.destroy();fs.closeSync(fd);}
          }
          main().catch(error=>{const message=String(error?.message||'');const reason=/^rust_database_(?:publication_disabled|upload_identity|upload_file|upload_hash|upload_token_missing|upload_deadline|upload_closed|upload_response_aborted|upload_http_[0-9]{3})$/.test(message)?message:'rust_database_upload_io_or_transport';console.error(reason);process.exitCode=1;});
          RUST_DATABASE_UPLOAD
  swift:
    needs: publication_policy
    name: Analyze (swift)
    strategy:
      fail-fast: false
      matrix:
        upload: ${{ fromJSON(needs.publication_policy.outputs.normal_uploads) }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the pinned compiler and SDK
        id: preflight
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/codeql-swift-build"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source.txt"
          xcodebuild -version > "$OUT/versions.txt"
          SWIFTC=$(xcrun --find swiftc)
          test -x "$SWIFTC"
          case "$SWIFTC" in
            "$DEVELOPER_DIR"/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$SWIFTC" > "$OUT/compiler-path.txt"
          shasum -a 256 "$SWIFTC" > "$OUT/compiler-sha256.txt"
          "$SWIFTC" --version >> "$OUT/versions.txt"
          grep -F 'Swift version 6.1.2' "$OUT/versions.txt"
          xcrun --sdk iphonesimulator --show-sdk-version > "$OUT/sdk-version.txt"
          test "$(cat "$OUT/sdk-version.txt")" = 18.5
          xcrun --sdk iphonesimulator --show-sdk-path > "$OUT/sdk-path.txt"
          printf 'linked=false\nruntime_executed=false\n' > "$OUT/scope.txt"
          git ls-files -z -- '*.swift' > "$OUT/inputs.nul"
          SOURCES=()
          while IFS= read -r -d '' source; do SOURCES+=("$source"); done < "$OUT/inputs.nul"
          test "${#SOURCES[@]}" = 1
          test "${SOURCES[0]}" = tools/CapturedHostingLowering.swift
          shasum -a 256 "${SOURCES[@]}" > "$OUT/inputs-sha256.txt"
          grep -Eq '^666e48d1a4e10f6d323b7cb0b9ed5b6a95a82e55b19706a8471ee41fb67339b0  tools/CapturedHostingLowering.swift$' "$OUT/inputs-sha256.txt"
          rosetta_status=0
          perl -e 'alarm 10; exec @ARGV; exit 127;' /usr/bin/arch -x86_64 /usr/bin/true > "$OUT/rosetta.stdout.txt" 2> "$OUT/rosetta.stderr.txt" || rosetta_status=$?
          printf 'status=%s\nprobe=x86_64_true\ninstallation_attempted=false\n' "$rosetta_status" > "$OUT/rosetta-status.txt"
          cat > "$OUT/compiler-phase.sh" <<'PHASE'
          #!/usr/bin/env bash
          set -euo pipefail
          BASE="$RUNNER_TEMP/codeql-swift-build"
          phase="${1-}"
          case "$phase" in
            nontrace) OUT="$BASE/nontrace"; limit=60 ;;
            traced-version) OUT="$BASE/traced-version"; limit=10 ;;
            trace) OUT="$BASE"; limit=60 ;;
            *) exit 2 ;;
          esac
          mkdir -p "$OUT"
          (set -o noclobber; : > "$OUT/phase-created")
