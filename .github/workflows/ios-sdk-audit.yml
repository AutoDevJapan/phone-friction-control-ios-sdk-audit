              test "$(wc -l < "$OUT/authorization-status-value.txt" | tr -d ' ')" = 1
              printf 'status_value_verified=true\npublic_status_getter_called=true\npublic_raw_value_getter_called=true\nstatus_case_name_observed=true\nauthorization_requested=false\ngrant_flow_verified=false\nmonitoring=false\nshielding=false\n' > "$OUT/authorization-status-value-scope.txt"
