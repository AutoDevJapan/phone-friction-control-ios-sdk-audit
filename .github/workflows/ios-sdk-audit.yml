name: Manual iOS SDK audit
on:
  workflow_dispatch:
    inputs:
      authorization_status_entry_probe:
        description: Inspect public authorization status metadata and getter entry without requesting access or calling the getter
        type: boolean
        default: false
      authorization_status_value_probe:
        description: Read the app's public status and reflected enum case in the isolated request-free process
        type: boolean
        default: false
      authorization_status_consent_probe:
        description: Read the public status on the main thread after the isolated OS consent test completes
        type: boolean
        default: false
      authorization_probe:
        description: Call the public individual authorization API once in the isolated Simulator
        type: boolean
        default: false
      native_uikit_host:
        description: Use the public UIKit application lifecycle with an empty inspection window
        type: boolean
        default: false
      xcode_signed_host:
        description: Link the Rust static library in an Xcode Simulator app target with Family Controls
        type: boolean
        default: false
      ui_consent_test:
        description: Use a Rust XCTest bundle to choose the OS permission button in the disposable Simulator
        type: boolean
        default: false
      ui_continue:
        description: Choose Continue instead of Don't Allow in the isolated UI test
        type: boolean
        default: false
      collect_xctest_headers:
        description: Inspect the selected public XCTest declarations before executing UI tests
        type: boolean
        default: false
      selection_inspection_mode:
        description: Inspect verified selection layout, public entries, or initial value lifetime without requesting access
        type: choice
        default: none
        options:
          - none
          - layout
          - entries
          - values
permissions:
  contents: read
jobs:
  sdk-audit:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-18
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - name: Inspect installed SDK and compiler output
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-sdk-audit"
          mkdir "$OUT"
          SELECTION_MODE='${{ inputs.selection_inspection_mode }}'
          case "$SELECTION_MODE" in
            none|layout|entries|values) ;;
            *) echo 'Unknown selection inspection mode' >&2; exit 1 ;;
          esac
          if [ "$SELECTION_MODE" != none ]; then
            test '${{ inputs.xcode_signed_host }}' = true
            test '${{ inputs.native_uikit_host }}' = true
            test '${{ inputs.authorization_probe }}' = true
            test '${{ inputs.ui_consent_test }}' = false
            test '${{ inputs.ui_continue }}' = false
            test '${{ inputs.authorization_status_entry_probe }}' = false
            test '${{ inputs.authorization_status_value_probe }}' = false
            test '${{ inputs.authorization_status_consent_probe }}' = false
            test '${{ inputs.collect_xctest_headers }}' = false
            printf 'phase=layout\nselection_layout_verified=false\nselection_values_constructed=0\nselection_values_read=0\ngrant_verified=false\nmonitoring_verified=false\nshielding_verified=false\n' > "$OUT/selection-layout-scope.txt"
          fi
          if [ '${{ inputs.authorization_status_value_probe }}' = true ]; then
            test '${{ inputs.authorization_status_entry_probe }}' = true
          fi
          if [ '${{ inputs.authorization_status_entry_probe }}' = true ]; then
            test '${{ inputs.authorization_status_consent_probe }}' = false
            test '${{ inputs.authorization_probe }}' = false
            test '${{ inputs.native_uikit_host }}' = false
            test '${{ inputs.xcode_signed_host }}' = false
            test '${{ inputs.ui_consent_test }}' = false
            test '${{ inputs.collect_xctest_headers }}' = false
          fi
          if [ '${{ inputs.authorization_status_consent_probe }}' = true ]; then
            test '${{ inputs.ui_consent_test }}' = true
          fi
          xcodebuild -version > "$OUT/versions.txt"
          xcrun swiftc --version >> "$OUT/versions.txt"
          rustc --version --verbose >> "$OUT/versions.txt"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if [ '${{ inputs.ui_consent_test }}' = true ]; then
            test '${{ inputs.xcode_signed_host }}' = true
            test '${{ inputs.native_uikit_host }}' = true
            test '${{ inputs.authorization_probe }}' = true
          else
            test '${{ inputs.ui_continue }}' = false
          fi
          if [ '${{ inputs.ui_consent_test }}' = true ] || [ '${{ inputs.collect_xctest_headers }}' = true ]; then
            TEST_FRAMEWORKS="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks"
            TEST_HEADERS="$TEST_FRAMEWORKS/XCTest.framework/Headers"
            test -d "$TEST_HEADERS"
            # Inspect only the public declarations used by the Rust test bundle.
            grep -R -n -A 5 -B 3 -E 'initWithBundleIdentifier:|waitForExistenceWithTimeout:|matchingIdentifier:|recordFailureWithDescription:|@property.*(alerts|buttons|firstMatch)|- \(void\)(tap|launch)' "$TEST_HEADERS" > "$OUT/xctest-selected-headers.txt"
            for SELECTOR in initWithBundleIdentifier waitForExistenceWithTimeout matchingIdentifier recordFailureWithDescription; do
              grep -F "$SELECTOR" "$OUT/xctest-selected-headers.txt"
            done
            if [ '${{ inputs.ui_continue }}' = true ]; then
              grep -R -n -A 3 -B 2 -E 'typeText:|@property.*secureTextFields' "$TEST_HEADERS" > "$OUT/xctest-fixture-input-headers.txt"
              grep -Eq '\(void\)[[:space:]]*typeText:[[:space:]]*\(NSString[[:space:]]*\*\)' "$OUT/xctest-fixture-input-headers.txt"
              grep -Eq '@property.*XCUIElementQuery[[:space:]]*\*[[:space:]]*secureTextFields' "$OUT/xctest-fixture-input-headers.txt"
            fi
            if [ '${{ inputs.ui_consent_test }}' = true ]; then
              UIKIT_HEADERS="$SDK/System/Library/Frameworks/UIKit.framework/Headers"
              grep -n -A 5 -B 3 -E 'UIButtonTypeSystem|buttonWithType:|setTitle:.*forState:' "$UIKIT_HEADERS/UIButton.h" > "$OUT/uikit-test-button-declarations.txt"
              grep -n -A 5 -B 3 -E 'UIControlEventTouchUpInside|UIControlStateNormal|addTarget:' "$UIKIT_HEADERS/UIControl.h" >> "$OUT/uikit-test-button-declarations.txt"
              # This SDK declares Custom=0 followed immediately by implicit System=1.
              awk '/^typedef NS_ENUM\(NSInteger, UIButtonType\) \{/ { getline; sub(/[[:space:]]*\/\/.*/, ""); if ($0 !~ /^[[:space:]]*UIButtonTypeCustom[[:space:]]*=[[:space:]]*0,[[:space:]]*$/) { bad=1; exit } getline; sub(/[[:space:]]*\/\/.*/, ""); if ($0 !~ /^[[:space:]]*UIButtonTypeSystem[[:space:]]+API_AVAILABLE\(ios\(7\.0\)\),[[:space:]]*$/) { bad=1; exit } found++ } END { exit (bad || found != 1) }' "$UIKIT_HEADERS/UIButton.h"
              grep -Eq 'UIControlEventTouchUpInside[[:space:]]*=[[:space:]]*1[[:space:]]*<<[[:space:]]*6([[:space:]]|,)' "$UIKIT_HEADERS/UIControl.h"
              grep -Eq 'UIControlStateNormal[[:space:]]*=[[:space:]]*0([[:space:]]|,)' "$UIKIT_HEADERS/UIControl.h"
            fi
          fi
          if [ '${{ inputs.collect_xctest_headers }}' = true ] && [ '${{ inputs.ui_consent_test }}' = false ]; then
            printf 'xctest_public_headers_collected=true\nui_test_executed=false\nauthorization_requested=false\n' > "$OUT/xctest-header-scope.txt"
            exit 0
          fi
          printf 'Simulator SDK: %s\n' "$VERSION" >> "$OUT/versions.txt"
          test "$VERSION" = 17.5
          grep -F 'Swift version 5.10' "$OUT/versions.txt"
          TARGET="arm64-apple-ios${VERSION%%.*}.0-simulator"
          for MODULE in FamilyControls DeviceActivity ManagedSettings; do
            FRAMEWORK="$SDK/System/Library/Frameworks/$MODULE.framework"
            test -d "$FRAMEWORK"
            # Dump to scratch space only; do not publish the complete SDK declarations.
            xcrun swift-api-digester -dump-sdk -module "$MODULE" -sdk "$SDK" -target "$TARGET" -o "$RUNNER_TEMP/$MODULE.json"
            jq '[.. | objects | select(.name? | IN("AuthorizationCenter", "shared", "requestAuthorization", "FamilyActivityPicker", "FamilyActivitySelection", "DeviceActivityCenter", "startMonitoring", "DeviceActivityEvent", "DeviceActivityMonitor", "ManagedSettingsStore", "ShieldSettings", "applications")) | {kind, name, printedName, usr, mangledName}]' "$RUNNER_TEMP/$MODULE.json" > "$OUT/$MODULE-symbols.json"
            test "$(jq length "$OUT/$MODULE-symbols.json")" -gt 0
            jq '[.. | objects | select(.kind? == "TypeDecl" and (.name? | IN("AuthorizationCenter", "AuthorizationStatus", "FamilyActivityPicker", "FamilyActivitySelection", "DeviceActivityCenter", "DeviceActivityMonitor", "DeviceActivityEvent", "ManagedSettingsStore", "ShieldSettings"))) | {name, usr, declKind, genericSig, members: [.children[]? | select(.name? | IN("shared", "requestAuthorization", "authorizationStatus", "notDetermined", "denied", "approved", "rawValue", "init", "startMonitoring", "intervalDidStart", "intervalDidEnd", "eventDidReachThreshold", "shield", "applications"))]}]' "$RUNNER_TEMP/$MODULE.json" > "$OUT/$MODULE-selected-declarations.json"
            if [ "$MODULE" = FamilyControls ]; then
              grep -oE '\$s14FamilyControls19AuthorizationCenterC[[:alnum:]_]+' "$FRAMEWORK/$MODULE.tbd" | sort -u > "$OUT/authorization-center-exports.txt"
              test -s "$OUT/authorization-center-exports.txt"
              xcrun swift-demangle --compact < "$OUT/authorization-center-exports.txt" > "$OUT/authorization-center-demangled.txt"
            fi
          done
          # Collect only the public declarations needed for a mutable selection
          # Binding and its hosting controller. Keep the full SDK dump in scratch.
          xcrun swift-api-digester -dump-sdk -module SwiftUI -sdk "$SDK" -target "$TARGET" -o "$RUNNER_TEMP/SwiftUI.json"
          jq '[.. | objects | select(.kind? == "TypeDecl" and (.name? | IN("Binding", "UIHostingController", "Transaction", "View"))) | {name, usr, declKind, genericSig, members: [.children[]? | select(.name? | IN("init", "wrappedValue", "projectedValue", "rootView", "body"))]}]' "$RUNNER_TEMP/SwiftUI.json" > "$OUT/SwiftUI-selected-declarations.json"
          test "$(jq length "$OUT/SwiftUI-selected-declarations.json")" -ge 4
          # Collect the SDK's own enum declaration, not inferred raw values.
          FRAMEWORK="$SDK/System/Library/Frameworks/FamilyControls.framework"
          if grep -R -n -A 12 -B 3 'FamilyControlsMember' "$FRAMEWORK/Headers" > "$OUT/family-controls-member-header.txt"; then
            printf 'member_definition_source=Headers\n' > "$OUT/member-definition-scope.txt"
          else
            grep -R --include='*.swiftinterface' -n -A 12 -B 3 'FamilyControlsMember' "$FRAMEWORK/Modules" > "$OUT/family-controls-member-header.txt"
            printf 'member_definition_source=Modules\n' > "$OUT/member-definition-scope.txt"
          fi
          test -s "$OUT/family-controls-member-header.txt"
          for TARGET in aarch64-apple-ios aarch64-apple-ios-sim; do
            mkdir "$OUT/$TARGET"
            rustc tools/ios-abi-probe.rs --crate-name ios_abi_probe --edition 2024 --crate-type lib --target "$TARGET" --emit llvm-ir,asm,obj --out-dir "$OUT/$TARGET"
            grep -q 'call swiftcc void @abi_probe_external' "$OUT/$TARGET/ios_abi_probe.ll"
            xcrun nm "$OUT/$TARGET/ios_abi_probe.o" > "$OUT/$TARGET/symbols.txt"
            grep 'U _abi_probe_external' "$OUT/$TARGET/symbols.txt"
          done
          printf 'compiler_codegen=true\nsdk_declarations_collected=true\ncodegen_framework_linked=false\ncodegen_os_executed=false\nauthorization=false\nmonitoring=false\nshielding=false\n' > "$OUT/scope.txt"
      - name: Inspect the public SDK singleton from a Rust Simulator process
        if: ${{ !inputs.collect_xctest_headers || inputs.ui_consent_test }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-sdk-audit"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export SDKROOT="$SDK" IPHONEOS_DEPLOYMENT_TARGET="$VERSION"
          if [ '${{ inputs.ui_consent_test }}' = true ]; then
            export UI_SYSTEM_BUTTON_TYPE=1 UI_TOUCH_UP_INSIDE_EVENT=64
          fi
          export AUTH_SHARED_SYMBOL=$(jq -er '[.[] | select(.name == "AuthorizationCenter") | .members[] | select(.name == "shared" and .static == true) | .accessors[] | select(.accessorKind == "get" and .static == true) | .mangledName] | if length == 1 then .[0] else error("expected one public static getter") end' "$OUT/FamilyControls-selected-declarations.json")
          grep -Fx "$AUTH_SHARED_SYMBOL" "$OUT/authorization-center-exports.txt"
          export AUTH_METADATA_SYMBOL=$(jq -er '[.[] | select(.name == "AuthorizationCenter") | .usr | sub("^s:"; "\u0024s") + "Ma"] | if length == 1 then .[0] else error("expected one class metadata accessor") end' "$OUT/FamilyControls-selected-declarations.json")
          grep -Fx "$AUTH_METADATA_SYMBOL" "$OUT/authorization-center-exports.txt"
          AUTH_REQUEST_SYMBOL=$(jq -er '[.[] | select(.name == "AuthorizationCenter") | .members[] | select(.name == "requestAuthorization" and .printedName == "requestAuthorization(for:)" and .throwing == true) | .mangledName] | if length == 1 then .[0] else error("expected one public individual async request") end' "$OUT/FamilyControls-selected-declarations.json")
          export AUTH_ASYNC_SYMBOL="${AUTH_REQUEST_SYMBOL}TjTu"
          grep -Fx "$AUTH_ASYNC_SYMBOL" "$OUT/authorization-center-exports.txt"
          REQUEST_ARGS=()
          if [ '${{ inputs.authorization_status_entry_probe }}' = true ] || [ '${{ inputs.authorization_status_consent_probe }}' = true ]; then
            export AUTH_STATUS_METADATA_SYMBOL=$(jq -er '[.[] | select(.name == "AuthorizationStatus" and .declKind == "Enum" and .genericSig == null and .usr == "s:14FamilyControls19AuthorizationStatusO") | .usr | sub("^s:"; "\u0024s") + "Ma"] | if length == 1 then .[0] else error("expected public status enum metadata") end' "$OUT/FamilyControls-selected-declarations.json")
            export AUTH_STATUS_GET_SYMBOL=$(jq -er '[.[] | select(.name == "AuthorizationCenter") | .members[] | select(.name == "authorizationStatus" and .children[0].usr == "s:14FamilyControls19AuthorizationStatusO") | .accessors[] | select(.accessorKind == "get" and .mangledName == "\u0024s14FamilyControls19AuthorizationCenterC19authorizationStatusAA0cF0Ovg") | .mangledName + "Tj"] | if length == 1 then .[0] else error("expected public status getter") end' "$OUT/FamilyControls-selected-declarations.json")
            export AUTH_STATUS_RAW_GET_SYMBOL=$(jq -er '[.[] | select(.name == "AuthorizationStatus") | .members[] | select(.name == "rawValue" and .children[0].printedName == "Swift.Int") | .accessors[] | select(.accessorKind == "get" and .mangledName == "\u0024s14FamilyControls19AuthorizationStatusO8rawValueSivg") | .mangledName] | if length == 1 then .[0] else error("expected public status raw value getter") end' "$OUT/FamilyControls-selected-declarations.json")
            grep -oE '\$s14FamilyControls19AuthorizationStatusO[[:alnum:]_]+' "$SDK/System/Library/Frameworks/FamilyControls.framework/FamilyControls.tbd" | sort -u > "$RUNNER_TEMP/status-candidate-exports.txt"
            { grep -Fx "$AUTH_STATUS_METADATA_SYMBOL" "$RUNNER_TEMP/status-candidate-exports.txt"; grep -Fx "$AUTH_STATUS_GET_SYMBOL" "$OUT/authorization-center-exports.txt"; grep -Fx "$AUTH_STATUS_RAW_GET_SYMBOL" "$RUNNER_TEMP/status-candidate-exports.txt"; } > "$OUT/authorization-status-public-entries.txt"
            test "$(wc -l < "$OUT/authorization-status-public-entries.txt" | tr -d ' ')" = 3
            grep -Eq '^#define[[:space:]]+RTLD_DEFAULT[[:space:]]+\(\(void[[:space:]]*\*\)[[:space:]]*-2\)' "$SDK/usr/include/dlfcn.h"
            grep -n -A 12 -B 3 'dli_fname' "$SDK/usr/include/dlfcn.h" > "$OUT/status-dladdr-declaration.txt"
            grep -n -A 18 -B 2 'public enum AuthorizationStatus :' "$SDK/System/Library/Frameworks/FamilyControls.framework/Modules/FamilyControls.swiftmodule/arm64-apple-ios-simulator.swiftinterface" > "$OUT/authorization-status-enum-definition.txt"
            if [ '${{ inputs.authorization_status_entry_probe }}' = true ]; then REQUEST_ARGS=(--cfg authorization_status_entry_probe); fi
            if [ '${{ inputs.authorization_status_value_probe }}' = true ] || [ '${{ inputs.authorization_status_consent_probe }}' = true ]; then
              grep -F '_swift_EnumCaseName' "$SDK/usr/lib/swift/libswiftCore.tbd" > "$OUT/status-reflection-export.txt"
              if [ '${{ inputs.authorization_status_value_probe }}' = true ]; then REQUEST_ARGS+=(--cfg authorization_status_value_probe); fi
            fi
          fi
          if [ '${{ inputs.authorization_probe }}' = true ]; then
            grep -F '_swift_stdlib_bridgeErrorToNSError' "$SDK/usr/lib/swift/libswiftCore.tbd"
            INTERFACE="$SDK/System/Library/Frameworks/FamilyControls.framework/Modules/FamilyControls.swiftmodule/arm64-apple-ios-simulator.swiftinterface"
            awk '/^@objc public enum FamilyControlsMember : Swift.Int,/ { found=1 } found { print } found && /^}/ { exit }' "$INTERFACE" > "$OUT/member-raw-value-definition.txt"
            grep -F '@objc public enum FamilyControlsMember : Swift.Int,' "$OUT/member-raw-value-definition.txt"
            test "$(grep -c '^  case ' "$OUT/member-raw-value-definition.txt")" -eq 2
            # Swift 5.10 ASTPrinter.cpp prints explicit @objc enum raw values.
            # Require exactly these two implicit cases in this order. Swift.Int
            # implicit raw values start at zero and increase by one (Swift book).
            test "$(grep '^  case ' "$OUT/member-raw-value-definition.txt")" = "$(printf '  case child\n  case individual')"
            export AUTH_INDIVIDUAL_VALUE=1
            awk '/^public enum FamilyControlsError / { found=1 } found { print } found && /^}/ { exit }' "$INTERFACE" > "$OUT/family-controls-error-definition.txt"
            REQUEST_ARGS=(--cfg auth_request)
          fi
          if [ '${{ inputs.native_uikit_host }}' = true ]; then
            test '${{ inputs.authorization_probe }}' = true
            REQUEST_ARGS+=(--cfg uikit_host)
          fi
          SELECTION_ARGS=()
          if [ '${{ inputs.selection_inspection_mode }}' != none ]; then
            # Require the exact public type and constructor signatures, not a
            # substring match that could accept an overload or private symbol.
            SELECTION_METADATA_SYMBOL=$(jq -er '[.[] | select(.name == "FamilyActivitySelection" and .declKind == "Struct" and .genericSig == null and .usr == "s:14FamilyControls0A17ActivitySelectionV") | .usr | sub("^s:"; "\u0024s") + "Ma"] | if length == 1 then .[0] else error("expected one Selection metadata accessor") end' "$OUT/FamilyControls-selected-declarations.json")
            SELECTION_INIT_SYMBOL=$(jq -er '[.[] | select(.name == "FamilyActivitySelection") | .members[] | select(.kind == "Constructor" and .printedName == "init()" and .moduleName == "FamilyControls" and .throwing != true and (.children | length) == 1 and .children[0].usr == "s:14FamilyControls0A17ActivitySelectionV" and .mangledName == "\u0024s14FamilyControls0A17ActivitySelectionVACycfc") | .mangledName | sub("cfc$"; "cfC")] | if length == 1 then .[0] else error("expected one public Selection init()") end' "$OUT/FamilyControls-selected-declarations.json")
            BINDING_METADATA_SYMBOL=$(jq -er '[.[] | select(.name == "Binding" and .declKind == "Struct" and .genericSig == "<Value>" and .usr == "s:7SwiftUI7BindingV") | .usr | sub("^s:"; "\u0024s") + "Ma"] | if length == 1 then .[0] else error("expected one Binding metadata accessor") end' "$OUT/SwiftUI-selected-declarations.json")
            BINDING_INIT_SYMBOL=$(jq -er '[.[] | select(.name == "Binding") | .members[] | select(.kind == "Constructor" and .printedName == "init(get:set:)" and .moduleName == "SwiftUI" and .genericSig == "<Value>" and .throwing != true and (.children | map(.printedName)) == ["SwiftUI.Binding<Value>", "() -> Value", "(Value) -> Swift.Void"] and .mangledName == "\u0024s7SwiftUI7BindingV3get3setACyxGxyc_yxctcfc") | .mangledName | sub("cfc$"; "cfC")] | if length == 1 then .[0] else error("expected one public Binding init without Transaction") end' "$OUT/SwiftUI-selected-declarations.json")
            export SELECTION_METADATA_SYMBOL SELECTION_INIT_SYMBOL BINDING_METADATA_SYMBOL BINDING_INIT_SYMBOL
            # The digester identifies initializing constructors (fc). The ABI's
            # allocating constructor entry (fC) is exported for these structs.
            # Require that exact public entry. Only the separate value phase
            # may invoke Selection.init(); Binding entries remain inspection-only.
            # Candidate exports stay in scratch. Publish only the seven exact
            # entries needed here; never publish complete tbd/SDK dumps.
            grep -oE '\$s14FamilyControls0A17ActivitySelectionV[[:alnum:]_]+' "$SDK/System/Library/Frameworks/FamilyControls.framework/FamilyControls.tbd" | sort -u > "$RUNNER_TEMP/selection-candidate-exports.txt"
            grep -oE '\$s7SwiftUI7BindingV[[:alnum:]_]+' "$SDK/System/Library/Frameworks/SwiftUI.framework/SwiftUI.tbd" | sort -u > "$RUNNER_TEMP/binding-candidate-exports.txt"
            grep -oE '_swift_(allocBox|projectBox|deallocBox)[[:alnum:]_]*' "$SDK/usr/lib/swift/libswiftCore.tbd" | sort -u > "$RUNNER_TEMP/box-candidate-exports.txt"
            grep -E '(VMa|VACycf[Cc]|V3get3setACyxGxyc_yxctcf[Cc])$' "$RUNNER_TEMP/selection-candidate-exports.txt" "$RUNNER_TEMP/binding-candidate-exports.txt" > "$OUT/selection-constructor-entries.txt" || true
            {
              grep -Fx "$SELECTION_METADATA_SYMBOL" "$RUNNER_TEMP/selection-candidate-exports.txt"
              grep -Fx "$SELECTION_INIT_SYMBOL" "$RUNNER_TEMP/selection-candidate-exports.txt"
              grep -Fx "$BINDING_METADATA_SYMBOL" "$RUNNER_TEMP/binding-candidate-exports.txt"
              grep -Fx "$BINDING_INIT_SYMBOL" "$RUNNER_TEMP/binding-candidate-exports.txt"
              grep -Fx '_swift_allocBox' "$RUNNER_TEMP/box-candidate-exports.txt"
              grep -Fx '_swift_projectBox' "$RUNNER_TEMP/box-candidate-exports.txt"
              grep -Fx '_swift_deallocBox' "$RUNNER_TEMP/box-candidate-exports.txt"
            } > "$OUT/selection-public-exports.txt"
            test "$(wc -l < "$OUT/selection-public-exports.txt" | tr -d ' ')" = 7
            # Verify the Darwin special dlsym handle against this SDK as well.
            grep -Eq '^#define[[:space:]]+RTLD_DEFAULT[[:space:]]+\(\(void[[:space:]]*\*\)[[:space:]]*-2\)' "$SDK/usr/include/dlfcn.h"
            SELECTION_ARGS=(--cfg selection_layout_probe)
            if [ '${{ inputs.selection_inspection_mode }}' = values ]; then
              SELECTION_ARGS+=(--cfg selection_value_probe)
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = entries ]; then
              BINDING_GET_SYMBOL=$(jq -er '[.[] | select(.usr == "s:7SwiftUI7BindingV") | .members[] | select(.kind == "Var" and .printedName == "wrappedValue") | .accessors[] | select(.accessorKind == "get" and .mangledName == "\u0024s7SwiftUI7BindingV12wrappedValuexvg") | .mangledName] | if length == 1 then .[0] else error("expected one public Binding getter") end' "$OUT/SwiftUI-selected-declarations.json")
              BINDING_SET_SYMBOL=$(jq -er '[.[] | select(.usr == "s:7SwiftUI7BindingV") | .members[] | select(.kind == "Var" and .printedName == "wrappedValue") | .accessors[] | select(.accessorKind == "set" and .mangledName == "\u0024s7SwiftUI7BindingV12wrappedValuexvs") | .mangledName] | if length == 1 then .[0] else error("expected one public Binding setter") end' "$OUT/SwiftUI-selected-declarations.json")
              export BINDING_GET_SYMBOL BINDING_SET_SYMBOL
              { grep -Fx "$BINDING_GET_SYMBOL" "$RUNNER_TEMP/binding-candidate-exports.txt"; grep -Fx "$BINDING_SET_SYMBOL" "$RUNNER_TEMP/binding-candidate-exports.txt"; } > "$OUT/binding-accessor-exports.txt"
              grep -n -A 12 -B 3 'dli_fname' "$SDK/usr/include/dlfcn.h" > "$OUT/dladdr-selected-declaration.txt"
              SELECTION_ARGS+=(--cfg binding_entry_probe)
            fi
          fi
          PROBE_APP="$OUT/authorization-center-probe.app"
          mkdir "$PROBE_APP"
          if [ '${{ inputs.xcode_signed_host }}' != true ]; then
            rustc tools/ios-abi-probe.rs --crate-name ios_runtime_probe --edition 2024 --cfg runtime_probe ${REQUEST_ARGS[@]+"${REQUEST_ARGS[@]}"} --target aarch64-apple-ios-sim --emit "llvm-ir=$OUT/ios_runtime_probe.ll,asm=$OUT/ios_runtime_probe.s,link" -L "native=$SDK/usr/lib/swift" -C link-arg=-Wl,-rpath,/usr/lib/swift -o "$PROBE_APP/authorization-center-probe"
          fi
          cat > "$PROBE_APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.autodevjapan.phonecontrol1614abiprobe</string>
          <key>CFBundleName</key><string>phone-friction-control（未定）</string>
          <key>CFBundleExecutable</key><string>authorization-center-probe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>0.0.1</string>
