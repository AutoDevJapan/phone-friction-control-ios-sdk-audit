              grep -n -A 12 -B 3 'dli_fname' "$SDK/usr/include/dlfcn.h" > "$OUT/picker-hosting-dladdr-declaration.txt"
              if [ '${{ inputs.selection_inspection_mode }}' = picker-entries ]; then SELECTION_ARGS+=(--cfg picker_entry_probe); else SELECTION_ARGS+=(--cfg picker_value_probe); fi
              if [ '${{ inputs.selection_inspection_mode }}' = picker-hosting ] || [ '${{ inputs.selection_inspection_mode }}' = consent-selection-acceptance ]; then SELECTION_ARGS+=(--cfg picker_hosting_probe); fi
