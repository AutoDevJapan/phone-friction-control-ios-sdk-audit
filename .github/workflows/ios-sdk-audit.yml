              grep -Fx 'status_getter_calls=1' "$OUT/public-authorization-result.txt"
              grep -Fx 'raw_value_getter_calls=1' "$OUT/public-authorization-result.txt"
              grep -Fx 'enum_case_name_calls=1' "$OUT/public-authorization-result.txt"
