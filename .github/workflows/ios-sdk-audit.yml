          LAUNCH_STATUS=0
          wait "$LAUNCH_PID" || LAUNCH_STATUS=$?
          LAUNCH_PID=''
          sed -n 's/^Picker hosting result: //p' "$OUT/singleton-runtime.txt" > "$OUT/picker-hosting-window-results.txt"
          grep -E '^Picker hosting entry bytes: ' "$OUT/singleton-runtime.txt" > "$OUT/picker-hosting-bl24-entry.txt" || true
          printf 'launch_status=%s\ncapture_status=%s\ncapture_scope=actual_hosting_window\nos_picker_contents_verified=false\n' "$LAUNCH_STATUS" "$CAPTURE_STATUS" > "$OUT/picker-hosting-window-scope.txt"
