            if grep -Fxq 'Picker hosting capture ready: actual_hosting_window=true; picker_contents_unverified=true' "$OUT/singleton-runtime.txt"; then READY=true; break; fi
            if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then break; fi
            sleep 0.1
          done
          CAPTURE_STATUS=1
