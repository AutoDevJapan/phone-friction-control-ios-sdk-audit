          if [ '${{ inputs.xcode_signed_host }}' = true ]; then
            # Observe the ordinary permission UI; do not approve or bypass it.
            xcrun simctl launch --console "$SIM_ID" com.autodevjapan.phonecontrol1614abiprobe > "$OUT/singleton-runtime.txt" 2>&1 &
            LAUNCH_PID=$!
            trap 'kill "$LAUNCH_PID" 2>/dev/null || true; wait "$LAUNCH_PID" 2>/dev/null || true; xcrun simctl shutdown "$SIM_ID" || true; xcrun simctl delete "$SIM_ID" || true' EXIT
            # Wait at most 45 seconds for this host's request to begin, so the
            # screenshots cover the permission UI rather than launch animation.
            for ATTEMPT in {1..45}; do
              if grep -Fq 'Public individual authorization request starting;' "$OUT/singleton-runtime.txt"; then break; fi
              if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            for FRAME in 1 2 3; do
              sleep 5
              xcrun simctl io "$SIM_ID" screenshot "$OUT/authorization-frame-$FRAME.png"
            done
            xcrun simctl spawn "$SIM_ID" log show --last 2m --style compact --predicate 'process == "authorization-center-probe" OR process == "FamilyControlsAgent"' > "$OUT/authorization-before-wait-log.txt" 2>&1
            if wait "$LAUNCH_PID"; then LAUNCH_STATUS=0; else LAUNCH_STATUS=$?; fi
            LAUNCH_PID=''
            xcrun simctl spawn "$SIM_ID" log show --last 2m --style compact --predicate 'process == "authorization-center-probe" OR process == "FamilyControlsAgent"' > "$OUT/authorization-process-log.txt" 2>&1
            test "$LAUNCH_STATUS" = 0
          else
            xcrun simctl launch --console "$SIM_ID" com.autodevjapan.phonecontrol1614abiprobe > "$OUT/singleton-runtime.txt" 2>&1
          fi
          grep -F 'SDK singleton class: FamilyControls.AuthorizationCenter' "$OUT/singleton-runtime.txt"
          UIKIT_ACTIVE=false
          if [ '${{ inputs.native_uikit_host }}' = true ]; then
            grep -F 'Rust UIKit launch callback observed; blank_window=true' "$OUT/singleton-runtime.txt"
            grep -F 'Rust UIKit active callback observed' "$OUT/singleton-runtime.txt"
            UIKIT_ACTIVE=true
          else
            grep -F 'Rust async task entry observed; authorization_requested=false' "$OUT/singleton-runtime.txt"
          fi
          REQUESTED=false
          if [ '${{ inputs.authorization_probe }}' = true ]; then
            grep -F 'SDK async continuation caller frame validated' "$OUT/singleton-runtime.txt"
            grep -F 'Public individual authorization continuation observed; error_present=' "$OUT/singleton-runtime.txt"
            REQUESTED=true
          fi
          printf 'simulator_process_executed=true\npublic_singleton_called=true\npublic_async_descriptor_read=true\nrust_async_task_entry_observed=true\nuikit_host_active=%s\nruntime_teardown_verified=false\nauthorization_requested=%s\nauthorization_status_verified=false\nmonitoring=false\nshielding=false\n' "$UIKIT_ACTIVE" "$REQUESTED" > "$OUT/singleton-runtime-scope.txt"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.selection_inspection_mode == 'none'
        with:
          name: ios-sdk-audit
          path: ${{ runner.temp }}/ios-sdk-audit
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.selection_inspection_mode != 'none'
        with:
          name: ios-selection-layout-audit
          path: |
            ${{ runner.temp }}/ios-sdk-audit/singleton-runtime.txt
            ${{ runner.temp }}/ios-sdk-audit/versions.txt
            ${{ runner.temp }}/ios-sdk-audit/xcode-build.txt
            ${{ runner.temp }}/ios-sdk-audit/rust-static-link.txt
            ${{ runner.temp }}/ios-sdk-audit/selection-layout.txt
            ${{ runner.temp }}/ios-sdk-audit/selection-layout-scope.txt
            ${{ runner.temp }}/ios-sdk-audit/selection-public-exports.txt
            ${{ runner.temp }}/ios-sdk-audit/selection-constructor-entries.txt
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.selection_inspection_mode == 'values'
        with:
          name: ios-selection-value-audit
          path: ${{ runner.temp }}/ios-sdk-audit/selection-value-results.txt
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
