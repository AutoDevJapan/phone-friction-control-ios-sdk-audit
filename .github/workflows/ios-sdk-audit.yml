          for FIELD in hosting_class_identity_verified hosting_superclass_verified root_controller_parent_nil root_view_window_identity_verified window_visible root_detached state_process_pinned; do test "$(grep -Fxc "$FIELD=true" "$RESULTS")" = 1; done
          for FIELD in authorization_requests status_getter_calls picker_contents_read private_api_calls callbacks_active extra_generic_arguments binding_public_getter_calls binding_public_setter_calls; do test "$(grep -Fxc "$FIELD=0" "$RESULTS")" = 1; done
          for FIELD in full_teardown_verified state_pointer_cleared selection_contents_output picker_ui_verified tokens_verified grant_verified monitoring_verified shielding_verified; do test "$(grep -Fxc "$FIELD=false" "$RESULTS")" = 1; done
          for EXPECTED in phase=picker_hosting_window returned_reference_ownership=plus_one sdk_deferred_owners=unknown rust_value_allocations=5 rust_value_deallocations=4; do test "$(grep -Fxc "$EXPECTED" "$RESULTS")" = 1; done
