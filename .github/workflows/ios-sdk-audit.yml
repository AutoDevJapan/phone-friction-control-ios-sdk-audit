            if declare -p "$PROBE_VAR" >/dev/null 2>&1; then declare -p "$PROBE_VAR" >> "$BUILD_ENV"; fi
          done
          declare -p REQUEST_ARGS SELECTION_ARGS >> "$BUILD_ENV"
      - name: Collect exact public application Set count ABI prerequisites
        if: inputs.selection_inspection_mode == 'consent-selection-acceptance'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-sdk-audit"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          source "$RUNNER_TEMP/ios-probe-build-env.sh"
          # Inspection only. No authored Swift/C/ObjC and no generic Set call.
          xcrun swift-api-digester -dump-sdk -module Swift -sdk "$SDK" -target arm64-apple-ios17.5-simulator -o "$RUNNER_TEMP/Swift.json"
          jq '[.. | objects | select(.kind? == "TypeDecl" and (.name? | IN("Set", "Hashable", "Equatable"))) | {name, usr, declKind, genericSig, conformances, members: [.children[]? | select(.name? | IN("count", "hash", "hashValue", "=="))]}]' "$RUNNER_TEMP/Swift.json" > "$OUT/Swift-set-selected-declarations.json"
          jq '[.. | objects | select(.kind? == "TypeDecl" and .name? == "Application") | {name, usr, declKind, genericSig, conformances, members: [.children[]? | select(.name? | IN("hash", "hashValue", "=="))]}]' "$RUNNER_TEMP/ManagedSettings.json" > "$OUT/ManagedSettings-Application-selected-declarations.json"
          APPLICATION_USR=$(jq -er '[.[] | select(.declKind == "Struct" and .genericSig == null and .usr == "s:15ManagedSettings11ApplicationV") | .usr] | if length == 1 then .[0] else error("expected non-generic public Application struct") end' "$OUT/ManagedSettings-Application-selected-declarations.json")
          APPLICATION_METADATA_SYMBOL="\$${APPLICATION_USR/s:/s}Ma"
          HASHABLE_PROTOCOL_SYMBOL=$(jq -er '[.[] | select(.name == "Hashable" and .declKind == "Protocol") | .usr | sub("^s:"; "\u0024s") + "Mp"] | if length == 1 then .[0] else error("expected public Hashable protocol") end' "$OUT/Swift-set-selected-declarations.json")
          SET_METADATA_SYMBOL=$(jq -er '[.[] | select(.name == "Set" and .declKind == "Struct") | .usr | sub("^s:"; "\u0024s") + "Ma"] | if length == 1 then .[0] else error("expected public Set metadata accessor") end' "$OUT/Swift-set-selected-declarations.json")
          SET_DESCRIPTOR_SYMBOL="${SET_METADATA_SYMBOL%Ma}Mn"
          SET_COUNT_SYMBOL=$(jq -er '[.[] | select(.name == "Set") | .members[] | select(.kind == "Var" and .name == "count" and .static != true and .children[0].printedName == "Swift.Int") | .accessors[] | select(.accessorKind == "get") | .mangledName] | unique | if length == 1 then .[0] else error("expected public Set.count -> Int getter") end' "$OUT/Swift-set-selected-declarations.json")
          APPLICATIONS_SYMBOL=$(jq -er '[.[] | select(.name == "FamilyActivitySelection") | .members[] | select(.kind == "Var" and .name == "applications" and .static != true and .children[0].printedName == "Swift.Set<ManagedSettings.Application>") | .accessors[] | select(.accessorKind == "get") | .mangledName] | if length == 1 then .[0] else error("expected exact public applications Set<Application> getter") end' "$OUT/FamilyControls-selected-declarations.json")
          for MODULE in Swift ManagedSettings FamilyControls; do
            if [ "$MODULE" = Swift ]; then TBD="$SDK/usr/lib/swift/libswiftCore.tbd"; else TBD="$SDK/System/Library/Frameworks/$MODULE.framework/$MODULE.tbd"; fi
            grep -oE '\$s[[:alnum:]_]+' "$TBD" | sort -u > "$RUNNER_TEMP/$MODULE-count-exports.txt"
          done
          : > "$OUT/selection-count-abi-manifest.txt"
          for ENTRY in "$SET_METADATA_SYMBOL" "$SET_COUNT_SYMBOL" "$APPLICATION_METADATA_SYMBOL" "$APPLICATIONS_SYMBOL"; do
            grep -Fx "$ENTRY" "$RUNNER_TEMP/Swift-count-exports.txt" "$RUNNER_TEMP/ManagedSettings-count-exports.txt" "$RUNNER_TEMP/FamilyControls-count-exports.txt" > /dev/null
            printf 'function|%s\n' "$ENTRY" >> "$OUT/selection-count-abi-manifest.txt"
          done
          grep -Fx "$HASHABLE_PROTOCOL_SYMBOL" "$RUNNER_TEMP/Swift-count-exports.txt"
          printf 'descriptor|%s\n' "$HASHABLE_PROTOCOL_SYMBOL" >> "$OUT/selection-count-abi-manifest.txt"
          grep -Fx "$SET_DESCRIPTOR_SYMBOL" "$RUNNER_TEMP/Swift-count-exports.txt"
          printf 'descriptor|%s\n' "$SET_DESCRIPTOR_SYMBOL" >> "$OUT/selection-count-abi-manifest.txt"
          # Collect all exported Application equality/hash witnesses and public
          # conformance descriptors together, avoiding one-symbol-per-run loops.
          APP_PREFIX="\$${APPLICATION_USR/s:/s}"
          while IFS= read -r ENTRY; do
            DEMANGLED=$(printf '%s\n' "$ENTRY" | xcrun swift-demangle --compact)
            case "$DEMANGLED" in
              *Hashable*|*Equatable*|*hash*|*'== '*|*'==('* )
                case "$ENTRY" in *Mc|*WP) KIND=descriptor ;; *) KIND=function ;; esac
                printf '%s|%s\n' "$KIND" "$ENTRY" >> "$OUT/selection-count-abi-manifest.txt" ;;
            esac
          done < <(grep -F "$APP_PREFIX" "$RUNNER_TEMP/ManagedSettings-count-exports.txt")
          test "$(wc -l < "$OUT/selection-count-abi-manifest.txt" | tr -d ' ')" -le 24
          cut -d '|' -f 2 "$OUT/selection-count-abi-manifest.txt" | xcrun swift-demangle --compact > "$OUT/selection-count-public-demangled.txt"
          grep -F 'Hashable' "$OUT/selection-count-public-demangled.txt"
          SELECTION_COUNT_ABI_MANIFEST=$(cat "$OUT/selection-count-abi-manifest.txt")
          export APPLICATION_METADATA_SYMBOL HASHABLE_PROTOCOL_SYMBOL SELECTION_COUNT_ABI_MANIFEST
          declare -p APPLICATION_METADATA_SYMBOL HASHABLE_PROTOCOL_SYMBOL SELECTION_COUNT_ABI_MANIFEST >> "$RUNNER_TEMP/ios-probe-build-env.sh"
          # Primary Swift 5.10 lowering/layout evidence accompanies actual SDK
          # prefixes. The generic receiver/metadata convention stays gated.
          for FILE in stdlib/public/core/Set.swift lib/IRGen/GenCall.cpp lib/IRGen/GenType.cpp include/swift/ABI/Metadata.h include/swift/Runtime/Metadata.h; do
            NAME=${FILE##*/}
            if [ "$FILE" = include/swift/Runtime/Metadata.h ]; then NAME=Runtime-Metadata.h; fi
            curl --fail --silent --show-error --location "https://raw.githubusercontent.com/swiftlang/swift/swift-5.10-RELEASE/$FILE" -o "$RUNNER_TEMP/count-$NAME"
            awk '/var count:|emitPolymorphicArguments|emitGenericArguments|emitTypeMetadataRef|GenericMetadataAccessFunction|TargetWitnessTable|TargetGenericContextDescriptorHeader/ { remaining=24 } remaining > 0 { line=NR ":" $0; bytes+=length(line)+1; if (bytes <= 48000) print line; remaining-- }' "$RUNNER_TEMP/count-$NAME" > "$OUT/selection-count-primary-$NAME.txt"
          done
          TEST_HEADERS="$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks/XCTest.framework/Headers"
          grep -R -n -A 4 -B 2 -E 'isHittable|typeText:|XCUIElementQuery.*(cells|buttons|searchFields|textFields)' "$TEST_HEADERS" > "$OUT/xctest-selection-control-headers.txt"
          # Semantic method types from actual SDK Clang AST, independent of
          # property spelling, annotations, horizontal spacing or line breaks.
          xcrun clang -target arm64-apple-ios17.5-simulator -isysroot "$SDK" -F "$(dirname "$(dirname "$TEST_HEADERS")")" -x objective-c -fsyntax-only -Xclang -ast-dump=json "$TEST_HEADERS/XCTest.h" > "$RUNNER_TEMP/xctest-selection-ast.json"
          jq '[.. | objects | select(.kind? == "ObjCMethodDecl" and (.name? | IN("isHittable", "cells", "buttons", "searchFields", "textFields", "typeText:"))) | {name, instance, returnType, parameters: [.inner[]? | select(.kind == "ParmVarDecl") | .type.qualType]}] | unique' "$RUNNER_TEMP/xctest-selection-ast.json" > "$OUT/xctest-selection-method-types.json"
          jq -e 'def abi_type: gsub("(_Nullable|_Nonnull|_Null_unspecified)"; "") | gsub("[[:space:]]+"; " ") | gsub("^ | $"; ""); ([.[] | select(.name == "isHittable" and .instance == true and ((.returnType.desugaredQualType // .returnType.qualType | abi_type) | IN("bool", "_Bool")))] | length > 0) and ([.[] | select((.name | IN("cells", "buttons", "searchFields", "textFields")) and .instance == true and (.returnType.qualType | abi_type) == "XCUIElementQuery *") | .name] | unique | length == 4) and ([.[] | select(.name == "typeText:" and .instance == true and .returnType.qualType == "void" and ([.parameters[] | abi_type] == ["NSString *"]))] | length > 0)' "$OUT/xctest-selection-method-types.json"
          printf 'applications_getter_called=false\nset_metadata_called=false\ncount_getter_called=false\nsemantic_selection_verified=false\npending_boundary=applications_return_set_specialization_count_receiver_and_ownership\n' > "$OUT/selection-count-abi-scope.txt"
      - name: Require exact public hosting UIKit signatures
        if: inputs.selection_inspection_mode == 'picker-hosting' || inputs.selection_inspection_mode == 'consent-selection-acceptance'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-sdk-audit"
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          HEADERS="$SDK/System/Library/Frameworks/UIKit.framework/Headers"
          # Fail before compiling/executing if a required selector signature is
          # absent. No Swift, C, ObjC source or guessed selector type is generated.
          : > "$OUT/picker-hosting-uikit-declarations.txt"
          # Gather only the selectors/types this probe uses before validation,
          # so a failed declaration guard retains its actual SDK context.
          : > "$OUT/picker-hosting-uikit-candidates.txt"
          for HEADER in UIScreen UIView UIWindow UIViewController; do
            grep -nE '(mainScreen|CGRect[[:space:]]+bounds|initWithFrame:|layoutIfNeeded|UIWindow.*window|isHidden|rootViewController|makeKeyAndVisible|UIView.*view;|parentViewController)' "$HEADERS/$HEADER.h" >> "$OUT/picker-hosting-uikit-candidates.txt" || true
          done
          require() {
            # C/ObjC declaration whitespace is insignificant. Canonicalize
            # horizontal blanks per line before matching the same type/name.
            if ! sed -E 's/[[:blank:]]+/ /g' "$1" | grep -E "$2" >> "$OUT/picker-hosting-uikit-declarations.txt"; then
              printf 'Required public declaration missing: %s; pattern=%s\n' "${1##*/}" "$2" >&2
              exit 1
            fi
          }
          require "$HEADERS/UIScreen.h" '(\+.*\(UIScreen \*\)mainScreen|@property\(class,.*UIScreen \*mainScreen)'
          require "$HEADERS/UIScreen.h" '@property.*CGRect bounds([[:space:]]+(API_|NS_)[^;]*)?;'
          require "$HEADERS/UIView.h" '\-.*\(instancetype\)initWithFrame:\(CGRect\)frame'
          require "$HEADERS/UIView.h" '\-.*\(void\)layoutIfNeeded;'
          require "$HEADERS/UIView.h" '\-.*\(void\)bringSubviewToFront:\(UIView \*\)view'
          require "$HEADERS/UIView.h" '@property.*UIWindow \*window([[:space:]]+(API_|NS_)[^;]*)?;'
          require "$HEADERS/UIView.h" '@property.*getter=isHidden.*BOOL hidden([[:space:]]+(API_|NS_)[^;]*)?;'
          require "$HEADERS/UIWindow.h" '@property.*strong.*UIViewController \*rootViewController([[:space:]]+(API_|NS_)[^;]*)?;'
          require "$HEADERS/UIWindow.h" '\-.*\(void\)makeKeyAndVisible;'
          require "$HEADERS/UIViewController.h" '@property.*UIView \*view([[:space:]]+(API_|NS_)[^;]*)?;'
          require "$HEADERS/UIViewController.h" '@property.*UIViewController \*parentViewController([[:space:]]+(API_|NS_)[^;]*)?;'
          # Inspect semantic declarations from the existing vendor header only.
          # No authored C/ObjC input, object, executable, or new SDK call.
          RUNTIME_HEADER="$SDK/usr/include/objc/runtime.h"
          require_runtime_function() {
            local SYMBOL=$1 EXPECTED=$2 RAW_AST="$RUNNER_TEMP/runtime-$1-ast.json" SELECTED="$OUT/runtime-$1-signature.json"
            xcrun clang -target arm64-apple-ios17.5-simulator -isysroot "$SDK" -x objective-c -fsyntax-only -Wno-pragma-once-outside-header -Xclang -ast-dump=json -Xclang "-ast-dump-filter=$SYMBOL" "$RUNTIME_HEADER" > "$RAW_AST"
            jq -s --arg symbol "$SYMBOL" '[.[] | select(.kind == "FunctionDecl" and .name == $symbol) | {name, type: .type.qualType, parameters: [.inner[]? | select(.kind == "ParmVarDecl") | .type.qualType]}] | if length > 0 then . else error("public runtime declaration absent") end' "$RAW_AST" > "$SELECTED"
            jq -e --arg expected "$EXPECTED" 'def abi_type: gsub("(_Nullable|_Nonnull|_Null_unspecified)"; "") | gsub("[[:space:]]+"; " ") | gsub("^ | $"; "") | gsub(" [)]"; ")"); all(.[]; (.type | abi_type) == $expected and (.parameters | length) == 1)' "$SELECTED"
            printf 'public_runtime_function=%s; semantic_type=%s\n' "$SYMBOL" "$EXPECTED" >> "$OUT/picker-hosting-uikit-declarations.txt"
          }
          require_runtime_function object_getClass 'Class (id)'
          require_runtime_function class_getSuperclass 'Class (Class)'
          GEOMETRY="$SDK/System/Library/Frameworks/CoreGraphics.framework/Headers/CGGeometry.h"
          require_record() {
            local SYMBOL=$1 EXPECTED=$2 RAW_AST="$RUNNER_TEMP/record-$1-ast.json" SELECTED="$OUT/record-$1-layout.json"
            xcrun clang -target arm64-apple-ios17.5-simulator -isysroot "$SDK" -x objective-c -fsyntax-only -Wno-pragma-once-outside-header -Xclang -ast-dump=json -Xclang "-ast-dump-filter=$SYMBOL" "$GEOMETRY" > "$RAW_AST"
            jq -s --arg symbol "$SYMBOL" '[.[] | select(.kind == "RecordDecl" and .name == $symbol and .completeDefinition == true) | {name, tag: .tagUsed, unsafe_layout_attributes: [.inner[]? | select(.kind == "PackedAttr" or .kind == "AlignedAttr") | .kind], fields: [.inner[]? | select(.kind == "FieldDecl") | {name, type: (.type.desugaredQualType // .type.qualType), bitfield: (.isBitfield // false)}]}] | if length > 0 then . else error("public geometry record absent") end' "$RAW_AST" > "$SELECTED"
            jq -e --argjson expected "$EXPECTED" 'all(.[]; .tag == "struct" and .unsafe_layout_attributes == [] and [.fields[] | {name, type}] == $expected and all(.fields[]; .bitfield == false))' "$SELECTED"
          }
          require_record CGPoint '[{"name":"x","type":"double"},{"name":"y","type":"double"}]'
          require_record CGSize '[{"name":"width","type":"double"},{"name":"height","type":"double"}]'
          require_record CGRect '[{"name":"origin","type":"struct CGPoint"},{"name":"size","type":"struct CGSize"}]'
          grep -oE '_swift_unknownObjectRelease([[:space:],]|$)' "$SDK/usr/lib/swift/libswiftCore.tbd" | sed -E 's/[[:space:],]+$//' | sort -u > "$OUT/picker-hosting-release-export.txt"
          test "$(cat "$OUT/picker-hosting-release-export.txt")" = _swift_unknownObjectRelease
          # Primary compiler rules: generic class metatype fulfills Content and
          # Content:View, so allocating init has no trailing generic arguments.
          # Keep the exact source/version for the parent's unsafe-call review.
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/swiftlang/swift/swift-5.10-RELEASE/lib/IRGen/GenProto.cpp' -o "$RUNNER_TEMP/hosting-GenProto.cpp"
          sed -n '197,245p;307,312p;383,446p;3847,3908p' "$RUNNER_TEMP/hosting-GenProto.cpp" > "$OUT/picker-hosting-generic-abi-primary.txt"
          grep -F 'Thick metatypes are sources of metadata.' "$OUT/picker-hosting-generic-abi-primary.txt"
          grep -F 'enumerateUnfulfilledRequirements' "$OUT/picker-hosting-generic-abi-primary.txt"
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/swiftlang/swift/swift-5.10-RELEASE/include/swift/Runtime/HeapObject.h' -o "$RUNNER_TEMP/hosting-HeapObject.h"
          sed -n '686,690p' "$RUNNER_TEMP/hosting-HeapObject.h" > "$OUT/picker-hosting-release-primary.txt"
          grep -Fx 'void swift_unknownObjectRelease(void *value);' "$OUT/picker-hosting-release-primary.txt"
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/swiftlang/swift/swift-5.10-RELEASE/include/swift/Runtime/RuntimeFunctions.def' -o "$RUNNER_TEMP/hosting-RuntimeFunctions.def"
          sed -n '335,342p' "$RUNNER_TEMP/hosting-RuntimeFunctions.def" >> "$OUT/picker-hosting-release-primary.txt"
          grep -Fx '         C_CC, AlwaysAvailable,' "$OUT/picker-hosting-release-primary.txt"
      - name: Build and sign the Rust Simulator probe
