            # image contains a usable OS Picker or prove authorization/selection.
            xcrun simctl io "$SIM_ID" screenshot "$OUT/picker-hosting-window.png" > "$OUT/picker-hosting-capture.txt" 2>&1 && CAPTURE_STATUS=0
