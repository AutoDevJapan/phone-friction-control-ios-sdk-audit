      - name: Execute the isolated Simulator inspection
        if: ${{ !inputs.collect_xctest_headers || inputs.ui_consent_test }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-sdk-audit"
          VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes -j | jq -er --arg version "$VERSION" '[.runtimes[] | select(.isAvailable and .version == $version and (.identifier | contains("iOS"))) | .identifier] | if length == 1 then .[0] else error("SDK-matching Simulator runtime missing or ambiguous") end')
          SIM_ID=$(xcrun simctl create phone-control1614-abi com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          trap 'xcrun simctl shutdown "$SIM_ID" || true; xcrun simctl delete "$SIM_ID" || true' EXIT
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$PROBE_APP"
          if [ '${{ inputs.selection_inspection_mode }}' != none ]; then
            # Preserve partial selection diagnostics even when the process fails.
            LAUNCH_STATUS=0
            xcrun simctl launch --console "$SIM_ID" com.autodevjapan.phonecontrol1614abiprobe > "$OUT/singleton-runtime.txt" 2>&1 || LAUNCH_STATUS=$?
            grep -E '^(Selection (layout:|box:|entry bytes:|layout inspection complete;)|Binding (control transfer:|accessor inspection complete;))' "$OUT/singleton-runtime.txt" > "$OUT/selection-layout.txt" || true
            if [ '${{ inputs.selection_inspection_mode }}' = values ]; then
              # Preserve actual partial counts on failure; never synthesize
              # successful value counts from the requested input.
              grep '^Selection value result: ' "$OUT/singleton-runtime.txt" | sed 's/^Selection value result: //' > "$OUT/selection-value-results.txt" || true
            fi
            test "$LAUNCH_STATUS" = 0
            grep -F 'Selection box: buffer_aligned=true; project_matches=true; uninitialized_deallocated=true' "$OUT/selection-layout.txt"
            grep -F 'Selection layout inspection complete; phase=layout; selection_values_constructed=0; selection_values_read=0; initializer_calls=0; closure_calls=0; value_witness_calls=0; authorization_requests=0;' "$OUT/selection-layout.txt"
            test "$(grep -c '^Selection layout:' "$OUT/selection-layout.txt")" = 2
            grep -Fx 'Selection layout: FamilyActivitySelection; size=56; stride=56; alignment=8; metadata_complete=true; kind_struct=true' "$OUT/selection-layout.txt"
            grep -Fx 'Selection layout: Binding<FamilyActivitySelection>; size=72; stride=72; alignment=8; metadata_complete=true; kind_struct=true' "$OUT/selection-layout.txt"
            test "$(grep -Ec '^Selection entry bytes: (FamilyActivitySelection\.|Binding<FamilyActivitySelection>\.|Binding.init\(get:set:\) without Transaction;)' "$OUT/selection-layout.txt")" = 6
            if [ '${{ inputs.selection_inspection_mode }}' = entries ]; then
              grep -F 'Binding accessor inspection complete; helper_calls=0; getter_calls=0; setter_calls=0; closure_calls=0; ownership_verified=false' "$OUT/selection-layout.txt"
              test "$(grep -c '^Selection entry bytes: Binding.wrappedValue getter;' "$OUT/selection-layout.txt")" = 1
              test "$(grep -c '^Selection entry bytes: Binding.wrappedValue setter;' "$OUT/selection-layout.txt")" = 1
              # Validate the actual control transfers, not an assumed BL in
              # every entry. The setter's first call is indirect in this SDK.
              grep -Fx 'Binding control transfer: Binding.set; source_offset=40; kind=indirect_call; target_read=false' "$OUT/selection-layout.txt"
              grep -F 'Binding control transfer: Binding.get; source_offset=0; kind=direct_branch;' "$OUT/selection-layout.txt" | grep -F 'same_image=true'
              test "$(grep -Fc 'Selection entry bytes: Binding.get.offset0 direct_branch target;' "$OUT/selection-layout.txt")" = 1
              for OFFSET in 8 40; do
                grep -F "Binding control transfer: Binding.init; source_offset=$OFFSET; kind=direct_call;" "$OUT/selection-layout.txt" | grep -F 'same_image=true'
                test "$(grep -Fc "Selection entry bytes: Binding.init.offset$OFFSET direct_call target;" "$OUT/selection-layout.txt")" = 1
              done
            fi
            printf 'phase=layout\nselection_layout_verified=true\nmetadata_complete=true\nmetadata_kind_struct=true\nbox_buffer_aligned=true\nbox_project_matches=true\nbox_uninitialized_deallocated=true\nentry_prefix_max_bytes=128\nentry_reads_page_bounded=true\nentry_registers_verified=false\nselection_values_constructed=0\nselection_values_read=0\ninitializer_calls=0\nclosure_calls=0\nvalue_witness_calls=0\ngrant_verified=false\nmonitoring_verified=false\nshielding_verified=false\n' > "$OUT/selection-layout-scope.txt"
            if [ '${{ inputs.selection_inspection_mode }}' = values ]; then
              RESULTS="$OUT/selection-value-results.txt"
              for EXPECTED in phase=value_lifecycle lifecycle_verified=true allocations=3 deallocations=3 initializer_calls=1 initializer_wrapper_calls=1 initialize_with_copy_calls=2 assign_with_copy_calls=1 destroy_calls=3 value_witness_calls=6 selection_values_constructed=3 selection_values_read=6 returned_destination_checks=3 byte_comparisons=3 independent_allocations=true source_destroyed_before_copy=true; do
                test "$(grep -Fxc "$EXPECTED" "$RESULTS")" = 1
              done
              for FIELD in binding_values_constructed binding_initializer_calls binding_getter_calls binding_setter_calls closure_calls authorization_requests private_api_calls private_api_reads; do
                test "$(grep -Fxc "$FIELD=0" "$RESULTS")" = 1
              done
              for FIELD in mutable_binding_verified mutable_values_verified picker_verified grant_verified monitoring_verified shielding_verified selection_contents_output; do
                test "$(grep -Fxc "$FIELD=false" "$RESULTS")" = 1
              done
              test "$(wc -l < "$RESULTS" | tr -d ' ')" = 31
            fi
            grep -F 'SDK singleton class: FamilyControls.AuthorizationCenter' "$OUT/singleton-runtime.txt"
            grep -F 'Rust UIKit active callback observed' "$OUT/singleton-runtime.txt"
            if grep -Fq 'Public individual authorization request starting;' "$OUT/singleton-runtime.txt"; then exit 1; fi
            printf 'authorization_requested=false\n' >> "$OUT/selection-layout-scope.txt"
            # Layout/box and optional default-value lifecycle only. Separate consent
            # fixture checks the authorization continuation after a UI choice.
            exit 0
          fi
          if [ '${{ inputs.authorization_status_entry_probe }}' = true ]; then
            xcrun simctl launch --console "$SIM_ID" com.autodevjapan.phonecontrol1614abiprobe > "$OUT/singleton-runtime.txt" 2>&1
            grep -F 'SDK singleton class: FamilyControls.AuthorizationCenter' "$OUT/singleton-runtime.txt"
            grep -E '^Authorization status (layout:|getter entry:|getter implementation:|raw value getter entry:|dispatch observed:|entry inspection complete;)' "$OUT/singleton-runtime.txt" > "$OUT/authorization-status-entry.txt"
            test "$(grep -c '^Authorization status layout:' "$OUT/authorization-status-entry.txt")" = 1
            test "$(grep -c '^Authorization status getter entry:' "$OUT/authorization-status-entry.txt")" = 1
            test "$(grep -c '^Authorization status getter implementation:' "$OUT/authorization-status-entry.txt")" = 1
            test "$(grep -c '^Authorization status raw value getter entry:' "$OUT/authorization-status-entry.txt")" = 1
            grep -Fx 'Authorization status dispatch observed: same_image=true; slot_derived=true; implementation_calls=0; raw_value_getter_calls=0' "$OUT/authorization-status-entry.txt"
            grep -Fx 'Authorization status entry inspection complete; phase=entry; status_getter_calls=0; enum_values_constructed=0; value_witness_calls=0; authorization_requests=0; grant_verified=false' "$OUT/authorization-status-entry.txt"
            if grep -Eq 'Public individual authorization request starting;|Rust async task entry observed;' "$OUT/singleton-runtime.txt"; then exit 1; fi
            printf 'phase=entry\nstatus_metadata_verified=true\nstatus_getter_called=false\nauthorization_requested=false\nauthorization_status_verified=false\ngrant_verified=false\nmonitoring=false\nshielding=false\n' > "$OUT/authorization-status-entry-scope.txt"
            if [ '${{ inputs.authorization_status_value_probe }}' = true ]; then
              grep -E '^Authorization status value read: raw_value=[012]; label=(notDetermined|denied|approved); status_getter_calls=1; raw_value_getter_calls=1; enum_case_name_calls=1; status_value_verified=true; authorization_requests=0; grant_verified=false$' "$OUT/singleton-runtime.txt" > "$OUT/authorization-status-value.txt"
              test "$(wc -l < "$OUT/authorization-status-value.txt" | tr -d ' ')" = 1
              printf 'status_value_verified=true\npublic_status_getter_called=true\npublic_raw_value_getter_called=true\nstatus_case_name_observed=true\nauthorization_requested=false\ngrant_flow_verified=false\nmonitoring=false\nshielding=false\n' > "$OUT/authorization-status-value-scope.txt"
            fi
            exit 0
          fi
          if [ '${{ inputs.ui_consent_test }}' = true ]; then

            mkdir -p "$XCODE_ROOT/Probe.xcodeproj/xcshareddata/xcschemes"
            cat > "$XCODE_ROOT/Probe.xcodeproj/xcshareddata/xcschemes/Probe.xcscheme" <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1540" version="1.3">
            <BuildAction parallelizeBuildables="NO" buildImplicitDependencies="YES"><BuildActionEntries>
              <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="NO" buildForArchiving="NO" buildForAnalyzing="YES"><BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A00000000000000000000002" BuildableName="authorization-center-probe.app" BlueprintName="authorization-center-probe" ReferencedContainer="container:Probe.xcodeproj"/></BuildActionEntry>
              <BuildActionEntry buildForTesting="YES" buildForRunning="NO" buildForProfiling="NO" buildForArchiving="NO" buildForAnalyzing="YES"><BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A00000000000000000000016" BuildableName="ProbeUITests.xctest" BlueprintName="ProbeUITests" ReferencedContainer="container:Probe.xcodeproj"/></BuildActionEntry>
            </BuildActionEntries></BuildAction>
            <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.IDEFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES"><Testables><TestableReference skipped="NO"><BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A00000000000000000000016" BuildableName="ProbeUITests.xctest" BlueprintName="ProbeUITests" ReferencedContainer="container:Probe.xcodeproj"/></TestableReference></Testables></TestAction>
          </Scheme>
          SCHEME
            xcodebuild -project "$XCODE_ROOT/Probe.xcodeproj" -scheme Probe -configuration Debug -sdk iphonesimulator -destination "id=$SIM_ID" -parallel-testing-enabled NO SYMROOT="$OUT/xcode-products" OBJROOT="$RUNNER_TEMP/xcode-objects" build-for-testing > "$OUT/xcode-ui-build.txt" 2>&1
            xcrun otool -L "$PROBE_APP/authorization-center-probe" > "$OUT/host-linked-libraries.txt"
            if grep -Fq 'XCTest.framework' "$OUT/host-linked-libraries.txt"; then
              printf 'Test framework unexpectedly linked into the inspected host\n' >&2
              exit 1
            fi
            if xcodebuild -project "$XCODE_ROOT/Probe.xcodeproj" -scheme Probe -configuration Debug -sdk iphonesimulator -destination "id=$SIM_ID" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 90 -resultBundlePath "$OUT/consent-ui.xcresult" SYMROOT="$OUT/xcode-products" OBJROOT="$RUNNER_TEMP/xcode-objects" test-without-building > "$OUT/xcode-ui-test.txt" 2>&1; then UI_TEST_STATUS=0; else UI_TEST_STATUS=$?; fi
            xcrun simctl io "$SIM_ID" screenshot "$OUT/consent-after-test.png"
            xcrun simctl spawn "$SIM_ID" log show --last 2m --style compact --predicate 'process == "authorization-center-probe" OR process == "FamilyControlsAgent"' > "$OUT/authorization-process-log.txt" 2>&1
            test "$UI_TEST_STATUS" = 0
            DATA=$(xcrun simctl get_app_container "$SIM_ID" com.autodevjapan.phonecontrol1614abiprobe data)
            cp "$DATA/Documents/public-authorization-result.txt" "$OUT/public-authorization-result.txt"
            grep -Fx 'public_authorization_continuation_observed=true' "$OUT/public-authorization-result.txt"
            if [ '${{ inputs.ui_continue }}' = false ]; then
              grep -Fx 'error_present=true' "$OUT/public-authorization-result.txt"
            else
              grep -Fx 'error_present=false' "$OUT/public-authorization-result.txt"
