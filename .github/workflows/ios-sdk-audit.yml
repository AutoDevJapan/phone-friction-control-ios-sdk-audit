          XCTEST
      - name: Execute the isolated Simulator inspection
        if: ${{ inputs.selection_inspection_mode != 'picker-hosting' && (!inputs.collect_xctest_headers || inputs.ui_consent_test) }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ios-sdk-audit"
          VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes -j | jq -er --arg version "$VERSION" '[.runtimes[] | select(.isAvailable and .version == $version and (.identifier | contains("iOS"))) | .identifier] | if length == 1 then .[0] else error("SDK-matching Simulator runtime missing or ambiguous") end')
          SIM_ID=$(xcrun simctl create phone-control1614-abi com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          trap 'xcrun simctl shutdown "$SIM_ID" || true; xcrun simctl delete "$SIM_ID" || true' EXIT
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$PROBE_APP"
          if [ '${{ inputs.selection_inspection_mode }}' != none ] && [ '${{ inputs.selection_inspection_mode }}' != consent-selection-acceptance ]; then
            # Preserve partial selection diagnostics even when the process fails.
            LAUNCH_STATUS=0
            xcrun simctl launch --console "$SIM_ID" com.autodevjapan.phonecontrol1614abiprobe > "$OUT/singleton-runtime.txt" 2>&1 || LAUNCH_STATUS=$?
            grep -E '^(Selection (layout:|box:|entry bytes:|layout inspection complete;)|Binding (control transfer:|accessor inspection complete;))' "$OUT/singleton-runtime.txt" > "$OUT/selection-layout.txt" || true
            if [ '${{ inputs.selection_inspection_mode }}' = picker-entries ]; then
              grep -E '^Picker/hosting (layout:|conformance:|class:|entry bytes:|control transfer:)' "$OUT/singleton-runtime.txt" > "$OUT/picker-hosting-entries.txt" || true
              grep '^Picker/hosting result: ' "$OUT/singleton-runtime.txt" | sed 's/^Picker\/hosting result: //' > "$OUT/picker-hosting-results.txt" || true
              printf 'launch_status=%s\n' "$LAUNCH_STATUS" > "$OUT/picker-hosting-launch.txt"
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = values ]; then
              grep '^Selection value result: ' "$OUT/singleton-runtime.txt" | sed 's/^Selection value result: //' > "$OUT/selection-value-results.txt" || true
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = mutable ]; then
              grep '^Mutable binding result: ' "$OUT/singleton-runtime.txt" | sed 's/^Mutable binding result: //' > "$OUT/mutable-binding-results.txt" || true
              grep '^Mutable binding entry guards: ' "$OUT/singleton-runtime.txt" > "$OUT/mutable-binding-entry-guards.txt" || true
              printf 'launch_status=%s\n' "$LAUNCH_STATUS" > "$OUT/mutable-binding-launch.txt"
              cat "$OUT/mutable-binding-launch.txt" "$OUT/mutable-binding-results.txt" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = picker-values ]; then
              bash "$RUNNER_TEMP/check-picker-values.sh" "$OUT" "$LAUNCH_STATUS"
              exit 0
            fi
            test "$LAUNCH_STATUS" = 0
            if [ '${{ inputs.selection_inspection_mode }}' != picker-entries ]; then
            grep -F 'Selection box: buffer_aligned=true; project_matches=true; uninitialized_deallocated=true' "$OUT/selection-layout.txt"
            grep -F 'Selection layout inspection complete; phase=layout; selection_values_constructed=0; selection_values_read=0; initializer_calls=0; closure_calls=0; value_witness_calls=0; authorization_requests=0;' "$OUT/selection-layout.txt"
            test "$(grep -c '^Selection layout:' "$OUT/selection-layout.txt")" = 2
            grep -Fx 'Selection layout: FamilyActivitySelection; size=56; stride=56; alignment=8; metadata_complete=true; kind_struct=true' "$OUT/selection-layout.txt"
            grep -Fx 'Selection layout: Binding<FamilyActivitySelection>; size=72; stride=72; alignment=8; metadata_complete=true; kind_struct=true' "$OUT/selection-layout.txt"
            test "$(grep -Ec '^Selection entry bytes: (FamilyActivitySelection\.|Binding<FamilyActivitySelection>\.|Binding.init\(get:set:\) without Transaction;)' "$OUT/selection-layout.txt")" = 6
            if [ '${{ inputs.selection_inspection_mode }}' = entries ]; then
              grep -F 'Binding accessor inspection complete; helper_calls=0; getter_calls=0; setter_calls=0; closure_calls=0; ownership_verified=false' "$OUT/selection-layout.txt"
              test "$(grep -c '^Selection entry bytes: Binding.wrappedValue getter;' "$OUT/selection-layout.txt")" = 1
              test "$(grep -c '^Selection entry bytes: Binding.wrappedValue setter;' "$OUT/selection-layout.txt")" = 1
              grep -Fx 'Binding control transfer: Binding.set; source_offset=40; kind=indirect_call; target_read=false' "$OUT/selection-layout.txt"
              grep -F 'Binding control transfer: Binding.get; source_offset=0; kind=direct_branch;' "$OUT/selection-layout.txt" | grep -F 'same_image=true'
              test "$(grep -Fc 'Selection entry bytes: Binding.get.offset0 direct_branch target;' "$OUT/selection-layout.txt")" = 1
              for OFFSET in 8 40; do
                grep -F "Binding control transfer: Binding.init; source_offset=$OFFSET; kind=direct_call;" "$OUT/selection-layout.txt" | grep -F 'same_image=true'
                test "$(grep -Fc "Selection entry bytes: Binding.init.offset$OFFSET direct_call target;" "$OUT/selection-layout.txt")" = 1
              done
            fi
            printf 'phase=layout\nselection_layout_verified=true\nmetadata_complete=true\nmetadata_kind_struct=true\nbox_buffer_aligned=true\nbox_project_matches=true\nbox_uninitialized_deallocated=true\nentry_prefix_max_bytes=128\nentry_reads_page_bounded=true\nentry_registers_verified=false\nselection_values_constructed=0\nselection_values_read=0\ninitializer_calls=0\nclosure_calls=0\nvalue_witness_calls=0\ngrant_verified=false\nmonitoring_verified=false\nshielding_verified=false\n' > "$OUT/selection-layout-scope.txt"
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = values ]; then
              RESULTS="$OUT/selection-value-results.txt"
              for EXPECTED in phase=value_lifecycle lifecycle_verified=true allocations=3 deallocations=3 initializer_calls=1 initializer_wrapper_calls=1 initialize_with_copy_calls=2 assign_with_copy_calls=1 destroy_calls=3 value_witness_calls=6 selection_values_constructed=3 selection_values_read=6 returned_destination_checks=3 byte_comparisons=3 independent_allocations=true source_destroyed_before_copy=true; do
                test "$(grep -Fxc "$EXPECTED" "$RESULTS")" = 1
              done
              for FIELD in binding_values_constructed binding_initializer_calls binding_getter_calls binding_setter_calls closure_calls authorization_requests private_api_calls private_api_reads; do
                test "$(grep -Fxc "$FIELD=0" "$RESULTS")" = 1
              done
              for FIELD in mutable_binding_verified mutable_values_verified picker_verified grant_verified monitoring_verified shielding_verified selection_contents_output; do
                test "$(grep -Fxc "$FIELD=false" "$RESULTS")" = 1
              done
              test "$(wc -l < "$RESULTS" | tr -d ' ')" = 31
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = mutable ]; then
              RESULTS="$OUT/mutable-binding-results.txt"
              for EXPECTED in phase=mutable_value mutable_binding_verified=true category_values_differ=true initial_get_equals_false=true changed_get_equals_true=true changed_get_differs_false=true restored_get_equals_false=true null_contexts=true binding_full_vwt=true main_thread_required=true; do
                test "$(grep -Fxc "$EXPECTED" "$RESULTS")" = 1
              done
              for FIELD in picker_verified tokens_verified grant_verified monitoring_verified shielding_verified selection_contents_output selection_addresses_output; do
                test "$(grep -Fxc "$FIELD=false" "$RESULTS")" = 1
              done
              for FIELD in authorization_requests private_api_calls private_api_reads; do
                test "$(grep -Fxc "$FIELD=0" "$RESULTS")" = 1
              done
              awk -F= '
                /^[a-z_]+=[0-9]+$/ { if (seen[$1]++) exit 1; n[$1]=$2 }
                END {
                  split("allocations deallocations category_initializer_calls binding_initializer_calls binding_getter_calls binding_setter_calls getter_closure_calls setter_closure_calls initialize_with_copy_calls assign_with_copy_calls destroy_calls binding_initialize_with_copy_calls binding_destroy_calls setter_inputs_transferred returned_destination_checks byte_comparisons callbacks_active", fields, " ");
                  for (i in fields) if (!(fields[i] in n)) exit 1;
                  if (!(n["allocations"]==n["deallocations"] && n["allocations"]==10 && n["category_initializer_calls"]==2 && n["binding_initializer_calls"]==1 && n["binding_getter_calls"]==3 && n["binding_setter_calls"]==2 && n["getter_closure_calls"]>=3 && n["setter_closure_calls"]==2 && n["initialize_with_copy_calls"]==3+n["getter_closure_calls"] && n["assign_with_copy_calls"]==n["setter_closure_calls"] && n["binding_initialize_with_copy_calls"]==1 && n["binding_destroy_calls"]==2 && n["setter_inputs_transferred"]==2 && n["destroy_calls"]==6 && n["returned_destination_checks"]==n["initialize_with_copy_calls"]+n["assign_with_copy_calls"]+n["binding_initialize_with_copy_calls"] && n["byte_comparisons"]==5 && n["callbacks_active"]==0)) exit 1;
                }' "$RESULTS"
              test "$(wc -l < "$RESULTS" | tr -d ' ')" = 37
              grep -Fx 'Mutable binding entry guards: category_first28=true; binding_register_prefixes=true; setter_outer_destroy=true; reconstructed_addresses_used=false' "$OUT/mutable-binding-entry-guards.txt"
            fi
            if [ '${{ inputs.selection_inspection_mode }}' = picker-entries ]; then
              RESULTS="$OUT/picker-hosting-results.txt"
              for EXPECTED in phase=picker_hosting_entry picker_metadata_calls=1 hosting_metadata_calls=1 conformance_calls=1 entry_prefix_max_bytes=128 entry_reads_page_bounded=true direct_helper_max_depth=1 metadata_inspection_verified=true; do test "$(grep -Fxc "$EXPECTED" "$RESULTS")" = 1; done
              for FIELD in picker_constructor_calls hosting_constructor_calls picker_values_constructed hosting_instances_constructed value_witness_calls box_api_calls authorization_requests status_getter_calls private_api_calls private_api_reads; do test "$(grep -Fxc "$FIELD=0" "$RESULTS")" = 1; done
              for FIELD in constructor_arguments_verified constructor_ownership_verified picker_ui_verified selection_contents_output reconstructed_addresses_used; do test "$(grep -Fxc "$FIELD=false" "$RESULTS")" = 1; done
              test "$(wc -l < "$RESULTS" | tr -d ' ')" = 23
              for KIND in layout conformance class; do test "$(grep -c "^Picker/hosting $KIND:" "$OUT/picker-hosting-entries.txt")" = 1; done
              for LABEL in 'FamilyActivityPicker.init(selection:)' 'UIHostingController.init(rootView:) allocating'; do test "$(grep -Fc "Picker/hosting entry bytes: $LABEL;" "$OUT/picker-hosting-entries.txt")" = 1; done
              if grep -Eq 'SDK singleton class:|Rust async task entry observed;|Authorization status ' "$OUT/singleton-runtime.txt"; then exit 1; fi
            else
              grep -F 'SDK singleton class: FamilyControls.AuthorizationCenter' "$OUT/singleton-runtime.txt"
